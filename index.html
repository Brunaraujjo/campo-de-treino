<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Campo de Treino</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a1020">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="favicon-32.png" type="image/png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Campo de Treino">
<link rel="apple-touch-icon" href="icon-180.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@500;600;700;800&display=swap">

<style>
  :root{
    --bg:#0a1020;
    --panel:#121a30;
    --panel-2:#18223f;
    --line:#26335a;
    --text:#eef2ff;
    --muted:#93a0c4;
    --blue:#3b7bff;
    --lime:#c8ff3a;
    --display:'Bebas Neue','Arial Narrow',Impact,sans-serif;
    --body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;background:var(--bg);color:var(--text);}
  body{
    font-family:var(--body);
    font-weight:600;
    font-size:16px;
    line-height:1.4;
    padding:0 16px calc(86px + env(safe-area-inset-bottom,0px));
    padding-top:env(safe-area-inset-top,0px);
    background:
      radial-gradient(900px 380px at 80% -120px, rgba(59,123,255,.28), transparent 70%),
      var(--bg);
    min-height:100vh;
  }
  .wrap{max-width:560px;margin:0 auto;}
  [hidden]{display:none !important;}
  button{font-family:inherit;color:inherit;}

  /* ---------- login ---------- */
  #auth{min-height:100vh;display:grid;place-items:center;}
  .auth-box{width:100%;max-width:360px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:28px 24px;}
  .brand{font-family:var(--display);font-size:46px;line-height:.95;letter-spacing:.02em;margin:0;text-align:center;}
  .brand span{color:var(--lime);}
  .auth-sub{text-align:center;color:var(--muted);margin:6px 0 22px;font-size:14px;}
  label.f{display:block;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px;}
  input[type=email],input[type=password],input[type=text]{
    width:100%;padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);
    background:var(--panel-2);color:var(--text);font:inherit;font-size:16px;
  }
  input:focus{outline:none;border-color:var(--blue);}
  .btn{
    display:block;width:100%;padding:14px;border:0;border-radius:12px;cursor:pointer;
    font-family:var(--display);font-size:24px;letter-spacing:.05em;
    background:var(--lime);color:#0a1020;margin-top:18px;
  }
  .btn:active{transform:translateY(1px);}
  .btn:disabled{opacity:.55;}
  .err{margin-top:12px;font-size:14px;color:#ffb4b4;background:#3a1a22;border:1px solid #5d2a36;border-radius:10px;padding:9px 12px;}
  .show-pass{background:none;border:0;color:var(--muted);font-size:13px;margin-top:6px;cursor:pointer;padding:4px 0;}

  /* ---------- topo ---------- */
  header{padding:18px 0 6px;}
  .top{display:flex;align-items:center;justify-content:space-between;}
  .tag{font-family:var(--display);font-size:20px;letter-spacing:.08em;color:var(--lime);}
  .out{background:none;border:1px solid var(--line);color:var(--muted);border-radius:10px;padding:6px 12px;font-size:13px;cursor:pointer;}
  .hello{font-family:var(--display);font-size:40px;line-height:1;margin:8px 0 14px;letter-spacing:.02em;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;}
  .lvl-row{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;}
  .lvl-name{font-family:var(--display);font-size:32px;line-height:1;color:var(--lime);letter-spacing:.03em;}
  .lvl-sub{font-size:13px;color:var(--muted);}
  .xp{font-family:var(--display);font-size:30px;line-height:1;text-align:right;}
  .xp small{display:block;font-family:var(--body);font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.04em;}
  .bar{height:12px;background:var(--panel-2);border-radius:99px;margin-top:12px;overflow:hidden;}
  .bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--blue),var(--lime));transition:width .5s;}
  .streak{margin-top:12px;font-size:15px;font-weight:800;}
  .streak span{color:var(--muted);font-weight:600;font-size:13px;}

  /* ---------- seções ---------- */
  main{margin-top:16px;}
  .sec-title{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:6px 0 12px;}
  .sec-title h2{font-family:var(--display);font-size:30px;letter-spacing:.04em;margin:0;line-height:1;}
  .nav{display:flex;align-items:center;gap:8px;}
  .nav button{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-size:20px;cursor:pointer;}
  .nav button:disabled{opacity:.3;}
  .nav .wk{font-size:13px;color:var(--muted);text-align:center;min-width:92px;font-weight:700;}
  .week-card{margin-bottom:14px;}
  .week-card .prog{display:flex;justify-content:space-between;font-size:14px;font-weight:800;}
  .week-card .prog span{color:var(--muted);font-weight:600;}
  .banner{background:rgba(200,255,58,.12);border:1px solid rgba(200,255,58,.35);color:var(--lime);border-radius:14px;padding:10px 14px;font-size:14px;margin-bottom:14px;}
  .subj{margin:18px 0 8px;display:flex;align-items:baseline;gap:8px;}
  .subj b{font-family:var(--display);font-size:24px;letter-spacing:.04em;font-weight:400;}
  .subj .topic{font-size:14px;color:var(--muted);}
  .mission{
    display:flex;align-items:center;gap:12px;width:100%;text-align:left;
    background:var(--panel);border:1.5px solid var(--line);border-radius:16px;
    padding:14px;margin-bottom:10px;cursor:pointer;font-size:16px;
    border-left:6px solid var(--c,var(--blue));
  }
  .mission .ck{
    flex:none;width:30px;height:30px;border-radius:50%;border:2.5px solid var(--c,var(--blue));
    display:grid;place-items:center;font-size:17px;color:#0a1020;
  }
  .mission .txt{flex:1;}
  .mission .xpt{font-family:var(--display);font-size:20px;color:var(--muted);letter-spacing:.04em;}
  .mission.done{background:rgba(200,255,58,.08);border-color:rgba(200,255,58,.35);border-left-color:var(--lime);}
  .mission.done .ck{background:var(--lime);border-color:var(--lime);}
  .mission.done .txt{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1.5px;}
  .mission.done .xpt{color:var(--lime);}

  /* treino livre */
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px;}
  .chip{
    border:1.5px solid var(--line);background:var(--panel-2);border-radius:99px;
    padding:9px 14px;font-size:15px;cursor:pointer;font-weight:700;
  }
  .chip.on{background:var(--c,var(--blue));border-color:var(--c,var(--blue));color:#0a1020;}
  .hint{font-size:13px;color:var(--muted);margin:8px 0 0;}
  .log{margin-top:6px;}
  .log-item{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-top:1px solid var(--line);font-size:15px;}
  .log-item:first-child{border-top:0;}
  .log-item .m{color:var(--lime);font-family:var(--display);font-size:20px;letter-spacing:.04em;white-space:nowrap;}
  .log-item small{display:block;color:var(--muted);font-weight:600;font-size:12px;}
  .empty{color:var(--muted);font-size:15px;padding:6px 0;}

  /* conquistas */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .badge{background:var(--panel);border:1.5px solid var(--line);border-radius:18px;padding:16px 12px;text-align:center;}
  .badge .ic{font-size:38px;filter:grayscale(1);opacity:.35;}
  .badge b{display:block;font-family:var(--display);font-weight:400;font-size:21px;letter-spacing:.04em;margin-top:6px;line-height:1.05;}
  .badge small{display:block;color:var(--muted);font-size:12.5px;margin-top:4px;font-weight:600;}
  .badge.ok{border-color:rgba(200,255,58,.5);background:rgba(200,255,58,.07);}
  .badge.ok .ic{filter:none;opacity:1;}

  /* estante */
  .book{display:flex;gap:14px;background:var(--panel);border:1.5px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;}
  .spine{flex:none;width:44px;height:64px;border-radius:4px 8px 8px 4px;background:hsl(var(--h),70%,52%);box-shadow:inset 4px 0 0 rgba(0,0,0,.2);}
  .bk{flex:1;min-width:0;}
  .bt{font-size:17px;font-weight:800;line-height:1.2;overflow-wrap:anywhere;}
  .ba{font-size:13px;color:var(--muted);margin-top:2px;}
  .bar.sm{height:8px;margin:10px 0 4px;}
  .pg{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:14px;flex-wrap:wrap;}
  .pg input{width:78px;padding:8px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--panel-2);color:var(--text);font:inherit;font-size:16px;}
  .row-btns{display:flex;gap:8px;margin-top:10px;align-items:center;flex-wrap:wrap;}
  .mini{border:1.5px solid var(--line);background:var(--panel-2);border-radius:10px;padding:8px 12px;font-size:14px;font-weight:800;cursor:pointer;}
  .mini.ok{background:var(--lime);border-color:var(--lime);color:#0a1020;}
  .doneTag{color:var(--lime);font-weight:800;font-size:14px;}

  /* mentalidade */
  .lesson{background:var(--panel);border:1.5px solid var(--line);border-radius:16px;margin-bottom:10px;overflow:hidden;}
  .lesson.done{border-color:rgba(200,255,58,.4);}
  .l-head{display:flex;align-items:center;gap:12px;width:100%;padding:14px;background:none;border:0;cursor:pointer;text-align:left;font-size:17px;font-weight:800;}
  .l-head .ic{font-size:28px;}
  .l-head .t{flex:1;line-height:1.2;}
  .l-head .st{font-family:var(--display);font-size:20px;color:var(--muted);letter-spacing:.04em;}
  .lesson.done .st{color:var(--lime);}
  .l-body{padding:0 16px 16px;font-size:16px;}
  .l-body p{margin:0 0 12px;}
  .l-desafio{background:rgba(59,123,255,.14);border:1px solid rgba(59,123,255,.4);border-radius:12px;padding:10px 12px;font-size:15px;margin-bottom:14px;}
  .l-desafio b{color:#8db0ff;}
  .l-q{font-weight:800;margin:0 0 10px;}
  .opt{display:block;width:100%;text-align:left;padding:12px 14px;margin-bottom:8px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel-2);font-size:15.5px;font-weight:700;cursor:pointer;}
  .opt.right{background:rgba(200,255,58,.18);border-color:var(--lime);}
  .opt.wrong{background:rgba(255,120,120,.14);border-color:#ff8a8a;}
  .l-msg{font-size:14px;font-weight:800;margin-top:4px;}

  /* diário */
  textarea{
    width:100%;padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);
    background:var(--panel-2);color:var(--text);font:inherit;font-size:16px;resize:vertical;min-height:96px;
  }
  textarea:focus{outline:none;border-color:var(--blue);}
  .counter{text-align:right;font-size:12px;color:var(--muted);margin:4px 2px 10px;}
  .stagebox{background:var(--bg);border:1.5px dashed var(--line);border-radius:14px;padding:12px 14px;}
  .stage{font-size:22px;line-height:1.5;white-space:pre-wrap;word-break:break-word;min-height:60px;}
  .stage .ph{color:var(--muted);font-size:15px;}
  .w{display:inline-block;white-space:nowrap;}
  .ch{display:inline-block;white-space:pre;}
  .ch.new{animation:drop .5s cubic-bezier(.34,1.56,.64,1) both;animation-delay:var(--d,0ms);}
  @keyframes drop{0%{opacity:0;transform:translateY(-28px) rotate(-14deg) scale(.4);}100%{opacity:1;transform:none;}}
  .wd{display:inline-flex;flex-direction:column;align-items:center;vertical-align:bottom;margin:0 3px;line-height:1.1;}
  .wd .fg{font-size:34px;line-height:1.15;}
  .wd.new .fg{animation:pop .7s cubic-bezier(.34,1.56,.64,1) both;animation-delay:var(--d,0ms);}
  @keyframes pop{0%{opacity:0;transform:scale(.2) rotate(-25deg);}100%{opacity:1;transform:none;}}
  .wd .lt{font-size:15px;color:var(--lime);}
  .entry{background:var(--panel);border:1.5px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;}
  .entry .d{font-size:12.5px;color:var(--muted);font-weight:800;letter-spacing:.04em;margin-bottom:4px;}
  .lock{color:var(--muted);font-weight:800;font-size:13px;}
  @media (prefers-reduced-motion:reduce){.ch.new,.wd.new .fg{animation:none !important;}}

  /* menu de baixo */
  .tabbar{
    position:fixed;left:0;right:0;bottom:0;z-index:20;
    background:rgba(10,16,32,.94);backdrop-filter:blur(10px);
    border-top:1px solid var(--line);
    padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));
  }
  .tabbar .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;}
  .tab{background:none;border:0;border-radius:14px;padding:8px 0;cursor:pointer;color:var(--muted);font-size:9.5px;font-weight:800;letter-spacing:0;}
  .tab .e{display:block;font-size:20px;margin-bottom:2px;}
  .tab.on{background:var(--panel-2);color:var(--lime);}

  /* avisos */
  .toast{
    position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);
    background:var(--lime);color:#0a1020;font-family:var(--display);font-size:24px;letter-spacing:.05em;
    padding:10px 22px;border-radius:99px;opacity:0;pointer-events:none;transition:.25s;z-index:50;text-align:center;max-width:92vw;
  }
  .toast.show{opacity:1;transform:translate(-50%,0);}
  .toast.warn{background:#ffb4b4;}

  .overlay{position:fixed;inset:0;background:rgba(5,9,20,.88);display:grid;place-items:center;padding:20px;z-index:60;}
  .overlay .card{width:100%;max-width:380px;}
  .overlay h3{font-family:var(--display);font-size:32px;margin:0 0 4px;letter-spacing:.03em;font-weight:400;}
  #app{display:none;}
  @media (prefers-reduced-motion:reduce){*{transition:none !important;}}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<section id="auth">
  <form class="auth-box" id="loginForm" autocomplete="on">
    <h1 class="brand">CAMPO DE<br><span>TREINO</span></h1>
    <p class="auth-sub">Entre para começar o treino de hoje</p>
    <label class="f" for="email">E-mail</label>
    <input type="email" id="email" autocomplete="username" required>
    <label class="f" for="pass">Senha</label>
    <input type="password" id="pass" autocomplete="current-password" required>
    <button type="button" class="show-pass" id="showPass">Mostrar senha</button>
    <div class="err" id="authErr" hidden></div>
    <button class="btn" id="loginBtn" type="submit">ENTRAR</button>
  </form>
</section>

<!-- ============ APP ============ -->
<div id="app">
  <div class="wrap">
    <header>
      <div class="top">
        <div class="tag">CAMPO DE TREINO</div>
        <button class="out" id="logout">Sair</button>
      </div>
      <div class="hello" id="hello">FALA, CRAQUE!</div>
      <div class="card" id="levelCard"></div>
    </header>

    <main>
      <section id="tab-missoes"></section>
      <section id="tab-estante" hidden></section>
      <section id="tab-mente" hidden></section>
      <section id="tab-diario" hidden></section>
      <section id="tab-conquistas" hidden></section>
    </main>
  </div>

  <nav class="tabbar">
    <div class="in">
      <button class="tab on" data-tab="missoes"><span class="e">⚽</span>MISSÕES</button>
      <button class="tab" data-tab="estante"><span class="e">📚</span>ESTANTE</button>
      <button class="tab" data-tab="mente"><span class="e">🧠</span>MENTE</button>
      <button class="tab" data-tab="diario"><span class="e">✍️</span>DIÁRIO</button>
      <button class="tab" data-tab="conquistas"><span class="e">🏆</span>CONQUISTAS</button>
    </div>
  </nav>
</div>

<!-- pergunta o nome na primeira vez -->
<div class="overlay" id="nameBox" hidden>
  <form class="card" id="nameForm">
    <h3>BEM-VINDO!</h3>
    <p style="color:var(--muted);margin:0 0 6px">Como você quer ser chamado no seu time?</p>
    <input type="text" id="nameInput" maxlength="20" autocomplete="off" placeholder="Seu nome ou apelido">
    <button class="btn" type="submit">BORA!</button>
  </form>
</div>

<div class="toast" id="toast"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
  import {
    getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut
  } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
  import {
    getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot
  } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDAoPv4qk8RHjhq6QFn5voIAFbMtzzwPYc",
    authDomain: "livro-caixa-63f4a.firebaseapp.com",
    projectId: "livro-caixa-63f4a",
    storageBucket: "livro-caixa-63f4a.firebasestorage.app",
    messagingSenderId: "524566546588",
    appId: "1:524566546588:web:e9666674336e2f68d6c559",
    measurementId: "G-GEZZLXZ22H"
  };
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  /* =====================================================================
     CONTEÚDO — plano de 8 semanas (estimativa; ajuste ao que a escola está vendo)
     Cada semana tem 4 missões por matéria. Cada missão vale 10 XP.
     ===================================================================== */
  const SUBJECTS = {
    mat: {name:'Matemática', color:'#ffb020', icon:'➗'},
    ing: {name:'Inglês',     color:'#3be0c4', icon:'🔤'},
    lei: {name:'Leitura',    color:'#ff9d5c', icon:'📚'},
    por: {name:'Português',  color:'#ff6b9a', icon:'📖'},
    cie: {name:'Ciências',   color:'#7ddc5a', icon:'🔬'},
    his: {name:'História',   color:'#b08cff', icon:'🏛️'},
    geo: {name:'Geografia',  color:'#5ac8ff', icon:'🌎'},
    out: {name:'Outra',      color:'#93a0c4', icon:'⭐'}
  };
  const PLAN = {
    mat: [
      {topic:'Números grandes', items:[
        'Ler e escrever números até a casa dos milhares',
        'Valor de cada algarismo: unidade, dezena, centena e milhar',
        'Comparar e colocar números em ordem',
        'Desafio: montar o maior número possível com 4 algarismos']},
      {topic:'Somar e subtrair', items:[
        'Somar com “vai um”',
        'Subtrair com “empresta um”',
        'Resolver 3 problemas de somar e tirar',
        'Desafio: 10 contas de cabeça em 1 minuto']},
      {topic:'Multiplicação', items:[
        'Tabuada do 2 ao 5',
        'Tabuada do 6 ao 9',
        'Multiplicar por 10, 100 e 1000',
        'Resolver 3 problemas de multiplicação']},
      {topic:'Divisão', items:[
        'Divisão como repartir em partes iguais',
        'Divisão com resto',
        'Ligação entre multiplicação e divisão',
        'Resolver 3 problemas de divisão']},
      {topic:'Frações', items:[
        'O que é fração: metade, terça parte e quarta parte',
        'Pintar frações em figuras',
        'Comparar frações simples',
        'Fração de uma quantidade (ex.: 1/2 de 20)']},
      {topic:'Números com vírgula', items:[
        'Décimos e centésimos',
        'Dinheiro: reais e centavos',
        'Comparar números com vírgula',
        'Somar e subtrair com vírgula']},
      {topic:'Medidas', items:[
        'Comprimento: metro e centímetro',
        'Peso e líquidos: kg, g, litro e ml',
        'Tempo: horas, minutos e calendário',
        'Perímetro: contornar uma figura']},
      {topic:'Formas e gráficos', items:[
        'Figuras planas e sólidos geométricos',
        'Ângulos: reto, menor e maior que reto',
        'Ler um gráfico e uma tabela',
        'Revisão: 5 questões misturadas']}
    ],
    ing: [
      {topic:'Cumprimentos', items:[
        'Hello, Good morning, Good afternoon e Goodbye',
        'Se apresentar: “My name is…”',
        'Alfabeto: soletrar o seu nome em inglês',
        'Falar em voz alta uma apresentação de 3 frases']},
      {topic:'Números e cores', items:[
        'Números de 1 a 20',
        'Números de 20 a 100',
        'As cores (colors)',
        'Jogo: dizer em inglês a cor de 10 objetos']},
      {topic:'Família', items:[
        'Family: mother, father, brother, sister…',
        'Frases: “This is my mother”',
        'Adjetivos: big, small, happy, sad',
        'Escrever 5 frases sobre a sua família']},
      {topic:'Escola', items:[
        'Material escolar: pencil, book, notebook…',

  const dayKey = (d) => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;   // fuso do celular, não UTC

    const t = new Date(); t.setHours(12,0,0,0);

  }

  /* ---- cálculos: XP, nível, sequência, conquistas ---- */
  function totals(){
    const done = Object.values(missions);
    const xpM = done.reduce((a, m) => a + (typeof m.xp === 'number' ? m.xp : XP_MISSION), 0);
    const xpT = treinos.reduce((a, t) => a + Math.min(t.minutes || 0, MAX_TREINO_MIN), 0);
    const pages = books.reduce((a, b) => a + (b.read || 0), 0);
    const nDone = books.filter(b => b.status === 'done').length;
    const xpL = Math.floor(pages / XP_PAGES) + nDone * XP_BOOK;     // XP de leitura vem da estante
    const nLessons = Object.keys(mind).length;
    return {xp: xpM + xpT + xpL + nLessons * XP_LESSON, nMissions: done.length, nTreinos: treinos.length, pages, nBooksDone: nDone, nLessons};
  }
  function levelOf(xp){
    let idx = 0;
    LEVELS.forEach((l, i) => { if(xp >= l.xp) idx = i; });
    return idx;
  }
  function activeDates(){
    const set = new Set();
    Object.values(missions).forEach(m => m.doneAt && set.add(m.doneAt));
    treinos.forEach(t => t.date && set.add(t.date));
    books.forEach(b => b.lastReadAt && set.add(b.lastReadAt));
    Object.values(mind).forEach(m => m.doneAt && set.add(m.doneAt));
    return set;
  }
  // Sequência: dias seguidos terminando hoje. Se hoje ainda não treinou, conta a partir de ontem.
  function currentStreak(set){
    let n = set.has(dayKey(daysAgo(0))) ? 0 : 1, c = 0;
    while(n < 800 && set.has(dayKey(daysAgo(n)))){ c++; n++; }
    return c;
  }
  function bestStreak(set){
    const days = [...set].sort();
    let best = 0, run = 0, prev = null;
    days.forEach(k => {
      const d = new Date(k + 'T12:00:00');
      if(prev && Math.round((d - prev) / 86400000) === 1) run++; else run = 1;
      best = Math.max(best, run); prev = d;
    });
    return best;
  }

      ${sec('LENDO AGORA', reading, 'Nenhum livro em andamento. Escolha um da lista “Quero ler”!')}
      ${sec('QUERO LER', want, 'Adicione livros que você quer ler depois.')}
      ${sec('JÁ LI', done, 'Os livros que você terminar aparecem aqui.')}`;
  }

  function renderMente(){
    const n = Object.keys(mind).length;
    const list = MIND.map(L => {
      const done = !!mind[L.id], open = openLesson === L.id, wrong = quizWrong[L.id];
      let body = '';
      if(open){
        const opts = L.o.map((txt, i) => {
          let cls = 'opt';
          if(done && i === L.a) cls += ' right';
          if(!done && wrong === i) cls += ' wrong';
          return `<button class="${cls}" data-action="answer" data-l="${L.id}" data-i="${i}">${esc(txt)}</button>`;
        }).join('');
        const msg = done ? `<div class="l-msg" style="color:var(--lime)">✓ Lição concluída!</div>`
                  : (wrong !== undefined ? `<div class="l-msg" style="color:#ffb4b4">Quase! Leia de novo e tente outra resposta.</div>` : '');
        body = `<div class="l-body"><p>${esc(L.p)}</p>
          <div class="l-desafio"><b>Desafio:</b> ${esc(L.d)}</div>
          <p class="l-q">${esc(L.q)}</p>${opts}${msg}</div>`;
      }
      return `<div class="lesson${done ? ' done' : ''}"><button class="l-head" data-action="openLesson" data-id="${L.id}">
        <span class="ic">${L.ic}</span><span class="t">${esc(L.t)}</span><span class="st">${done ? '✓' : '+' + XP_LESSON}</span></button>${body}</div>`;
    }).join('');
    $('tab-mente').innerHTML = `
      <div class="sec-title"><h2>MENTALIDADE</h2><span style="color:var(--muted);font-weight:800">${n} de ${MIND.length}</span></div>
      <p class="hint" style="margin:-4px 0 12px">Lições curtas para treinar a cabeça de um craque. Responda a pergunta certa e ganhe +${XP_LESSON} XP.</p>
      ${list}`;
  }

  /* ---- Diário: o texto vira figuras e as letras entram "quicando" ---- */
  const normWord = (w) => w.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  function figureFor(word){
    const w = normWord(word);
    return FIG[w] || FIG[w.replace(/(.)\1+/g, '$1')] || (w.endsWith('s') ? FIG[w.slice(0, -1)] : undefined);
  }
  // animFrom: letras a partir desse número entram animadas. stagger: espera entre letras (ms).
  function buildStage(text, animFrom, stagger){
    const parts = text.match(/[\p{L}\p{N}'’-]+|[^\p{L}\p{N}'’-]/gu) || [];
    let idx = 0, html = '';
    const letter = (ch, i) => {
      const isNew = i >= animFrom;
      const d = isNew && stagger ? Math.min((i - animFrom) * stagger, 2500) : 0;
      return `<span class="ch${isNew ? ' new' : ''}" style="--d:${d}ms">${esc(ch)}</span>`;
    };
    parts.forEach(part => {
      const chars = [...part];
      if(/[\p{L}\p{N}]/u.test(part)){
        const inner = chars.map((ch, k) => letter(ch, idx + k)).join('');
        const fig = figureFor(part);
        const endsNew = idx + chars.length - 1 >= animFrom;
        const dd = endsNew && stagger ? Math.min((idx + chars.length - animFrom) * stagger, 2500) : 0;
        html += fig ? `<span class="wd${endsNew ? ' new' : ''}" style="--d:${dd}ms"><span class="fg">${fig}</span><span class="lt w">${inner}</span></span>`
                    : `<span class="w">${inner}</span>`;
      }else if(part === '\n') html += '<br>';
      else if(part === ' ') html += ' ';
      else html += letter(part, idx);
      idx += chars.length;
    });
    return html;
  }
  function ensureDiaryShell(){
    if($('diaryText')) return;
    diaryPrev = 0;
    $('tab-diario').innerHTML = `
      <div class="sec-title"><h2>MEU DIÁRIO</h2><span class="lock">🔒 só meu</span></div>
      <p class="hint" style="margin:-4px 0 12px">Escreva o que você pensa. Algumas palavras viram desenho sozinhas. Teste: gol, craque, foco, mente…</p>
      <div class="card">
        <textarea id="diaryText" maxlength="500" rows="4" placeholder="Hoje eu penso que…"></textarea>
        <div class="counter"><span id="diaryCount">0</span>/500</div>
        <div class="stagebox"><div class="stage" id="diaryStage"><span class="ph">Aqui o que você escrever ganha vida ✨</span></div></div>
        <button class="btn" data-action="diarySave">GUARDAR PENSAMENTO</button>
      </div>
      <div class="sec-title" style="margin-top:22px"><h2>MEUS PENSAMENTOS</h2></div>
      <div id="diaryList"></div>`;
  }
  function updateStage(){
    const text = $('diaryText').value, len = [...text].length;
    const grew = len - diaryPrev;
    $('diaryStage').innerHTML = text ? buildStage(text, Math.min(diaryPrev, len), grew > 1 ? 25 : 0)
                                     : '<span class="ph">Aqui o que você escrever ganha vida ✨</span>';
    $('diaryCount').textContent = len;
    diaryPrev = len;
  }
  function renderDiaryList(){
    ensureDiaryShell();
    const list = [...diary].sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''));
    $('diaryList').innerHTML = list.length ? list.map(e => {
      const d = new Date(e.date + 'T12:00:00');
      return `<div class="entry"><div class="d">${fmt(d)}</div>
        <div class="stage" style="min-height:0">${buildStage(e.text, replayId === e.id ? 0 : Infinity, 30)}</div>
        <div class="row-btns"><button class="mini" data-action="diaryReplay" data-id="${e.id}">▶ Ver de novo</button>
          <button class="mini" data-action="diaryDelete" data-id="${e.id}">Apagar</button></div></div>`;
    }).join('') : '<div class="empty">Seus pensamentos vão aparecer aqui.</div>';
  }

  function renderTreino(){
    const chips = Object.entries(SUBJECTS).map(([k, S]) =>
      `<button type="button" class="chip${trSubject === k ? ' on' : ''}" style="--c:${S.color}" data-action="trSubject" data-k="${k}">${S.icon} ${S.name}</button>`).join('');
    const mins = [5, 10, 15, 20, 30].map(m =>
      `<button type="button" class="chip${trMinutes === m ? ' on' : ''}" data-action="trMinutes" data-m="${m}">${m} min</button>`).join('');
    const last = [...treinos].sort((a, b) => (b.date + (b.at || '')).localeCompare(a.date + (a.at || ''))).slice(0, 8);
    const log = last.length ? last.map(t => {
      const S = SUBJECTS[t.subject] || SUBJECTS.out, d = new Date(t.date + 'T12:00:00');
      return `<div class="log-item"><div>${S.icon} ${S.name}<small>${fmt(d)}</small></div><div class="m">+${Math.min(t.minutes, MAX_TREINO_MIN)} XP · ${t.minutes} min</div></div>`;
    }).join('') : '<div class="empty">Ainda não tem treino registrado. Que tal o primeiro?</div>';

    const box = $('treinoBox'); if(!box) return;
    box.innerHTML = `
      <div class="sec-title"><h2>TREINO LIVRE</h2></div>
      <div class="card">
        <p style="margin:0 0 6px">Estudou por conta própria? Conte aqui e ganhe <b style="color:var(--lime)">1 XP por minuto</b> (até ${MAX_TREINO_MIN} por treino).</p>
        <label class="f">O que você estudou?</label><div class="chips">${chips}</div>
        <label class="f">Quanto tempo?</label><div class="chips">${mins}</div>
        <button class="btn" data-action="addTreino">REGISTRAR TREINO</button>
      </div>
      <div class="sec-title" style="margin-top:22px"><h2>ÚLTIMOS TREINOS</h2></div>
      <div class="card log">${log}</div>`;
  }

  function renderConquistas(){
    const list = badges(), n = list.filter(b => b.ok).length;
    $('tab-conquistas').innerHTML = `
      <div class="sec-title"><h2>CONQUISTAS</h2><span style="color:var(--muted);font-weight:800">${n} de ${list.length}</span></div>
      <div class="grid">${list.map(b => `<div class="badge${b.ok ? ' ok' : ''}"><div class="ic">${b.ic}</div><b>${b.name}</b><small>${b.desc}</small></div>`).join('')}</div>`;
  }

  function renderAll(){
    renderHeader(); renderMissions(); renderEstante(); renderTreino(); renderMente(); renderDiaryList(); renderConquistas();
    // nível subiu? (só depois do primeiro carregamento, para não avisar ao abrir o app)
    if(loaded.m && loaded.t && loaded.b && loaded.n){
      const li = levelOf(totals().xp);
      if(lastLevelIdx !== null && li > lastLevelIdx) setTimeout(() => toast(`🏆 SUBIU: ${LEVELS[li].name}!`), 900);
      lastLevelIdx = li;
    }
  }

  /* =====================================================================
     AÇÕES (clique em missão, treino, abas)
     ===================================================================== */
  async function toggleMission(id, s, w, xp){
    if(!uid) return;
    const ref = doc(db, 'users', uid, 'missoes', id);
    const wasDone = !!missions[id];
    const rec = {doneAt: dayKey(daysAgo(0)), subject: s, week: Number.isFinite(w) ? w : null, xp};
    // 1) muda na tela na hora
    if(wasDone) delete missions[id]; else missions[id] = rec;
    renderAll();
    if(!wasDone) toast(`⚽ GOL! +${xp} XP`);
    // 2) grava na nuvem; se falhar, desfaz
    try{
      if(wasDone) await deleteDoc(ref); else await setDoc(ref, rec);
    }catch(e){
      if(wasDone) missions[id] = rec; else delete missions[id];
      renderAll(); toast('Sem conexão. Tente de novo!', true);
    }
  }

  /* ---- mentalidade ---- */
  async function answerLesson(id, i){
    const L = MIND.find(x => x.id === id);
    if(!L || mind[id]) return;
    if(i !== L.a){ quizWrong[id] = i; renderMente(); return; }
    delete quizWrong[id];
    const rec = {doneAt: dayKey(daysAgo(0))};
    mind[id] = rec; renderAll(); toast(`🧠 +${XP_LESSON} XP!`);
    try{ await setDoc(doc(db, 'users', uid, 'mente', id), rec); }
    catch(e){ delete mind[id]; renderAll(); toast('Sem conexão. Tente de novo!', true); }
  }

  /* ---- diário ---- */
  async function saveDiary(){
    const ta = $('diaryText'), text = ta.value.trim();
    if(!text || !uid) return;
    const ref = doc(collection(db, 'users', uid, 'diario'));
    const e = {id: ref.id, text, date: dayKey(daysAgo(0)), createdAt: new Date().toISOString()};
    diary.push(e);
    ta.value = ''; diaryPrev = 0; updateStage();
    renderDiaryList(); toast('✍️ Guardado!');
    try{ const {id, ...data} = e; await setDoc(ref, data); }
    catch(err){ diary = diary.filter(x => x.id !== e.id); renderDiaryList(); toast('Sem conexão. Tente de novo!', true); }
  }
  async function deleteDiary(id){
    const e = diary.find(x => x.id === id);
    if(!e || !confirm('Apagar este pensamento?')) return;
    diary = diary.filter(x => x.id !== id); renderDiaryList();
    try{ await deleteDoc(doc(db, 'users', uid, 'diario', id)); }
    catch(err){ diary.push(e); renderDiaryList(); toast('Sem conexão. Tente de novo!', true); }
  }

  /* ---- estante ---- */
  async function saveBook(b){               // grava o livro inteiro (menos o id, que é o nome do documento)
    const {id, ...data} = b;
    await setDoc(doc(db, 'users', uid, 'livros', id), data);
  }
  async function updateBook(id, patch, msg){
    const i = books.findIndex(b => b.id === id);
    if(i < 0) return;
    const before = books[i], oldXp = totals().xp;
    books[i] = Object.assign({}, before, patch);
    renderAll();
    const gain = totals().xp - oldXp;
    if(msg) toast(msg.replace('{xp}', gain));
    try{ await saveBook(books[i]); }
    catch(e){ books[i] = before; renderAll(); toast('Sem conexão. Tente de novo!', true); }
  }
  async function addBook(title, author, pages){
    const ref = doc(collection(db, 'users', uid, 'livros'));
    const b = {id: ref.id, title, author, pages, read: 0, status: 'want', createdAt: new Date().toISOString()};
    books.push(b); showAddBook = false; renderAll(); toast('📚 Na estante!');
    try{ await saveBook(b); }
    catch(e){ books = books.filter(x => x.id !== b.id); renderAll(); toast('Sem conexão. Tente de novo!', true); }
  }
  async function removeBook(id){
    const b = books.find(x => x.id === id);
    if(!b || !confirm(`Tirar “${b.title}” da estante?`)) return;
    books = books.filter(x => x.id !== id); renderAll();
    try{ await deleteDoc(doc(db, 'users', uid, 'livros', id)); }
    catch(e){ books.push(b); renderAll(); toast('Sem conexão. Tente de novo!', true); }
  }

  async function addTreino(){
    if(!uid) return;
    const data = {date: dayKey(daysAgo(0)), subject: trSubject, minutes: trMinutes, at: new Date().toISOString()};
    const ref = doc(collection(db, 'users', uid, 'treinos'));       // id automático
    treinos.push({id: ref.id, ...data});
    renderAll();
    toast(`⏱️ +${Math.min(trMinutes, MAX_TREINO_MIN)} XP!`);
    try{ await setDoc(ref, data); }
    catch(e){ treinos = treinos.filter(t => t.id !== ref.id); renderAll(); toast('Sem conexão. Tente de novo!', true); }
  }

  function showTab(name){
    ['missoes', 'estante', 'mente', 'diario', 'conquistas'].forEach(k => { $('tab-' + k).hidden = (k !== name); });
    document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.tab === name));
    window.scrollTo({top: 0});
  }

  document.addEventListener('click', (e) => {
    const tab = e.target.closest('.tab');
    if(tab){ showTab(tab.dataset.tab); return; }
    const el = e.target.closest('[data-action]');
    if(!el) return;
    const a = el.dataset.action;
    if(a === 'toggle') toggleMission(el.dataset.id, el.dataset.s, el.dataset.w === '' ? NaN : Number(el.dataset.w), Number(el.dataset.xp));
    else if(a === 'toggleAddBook'){ showAddBook = !showAddBook; renderEstante(); }
    else if(a === 'startBook') updateBook(el.dataset.id, {status:'reading', lastReadAt: dayKey(daysAgo(0))}, '📖 Boa leitura!');
    else if(a === 'savePage'){
      const b = books.find(x => x.id === el.dataset.id);
      const v = Math.max(0, Math.min(b.pages, parseInt(document.getElementById('pg-' + b.id).value, 10) || 0));
      if(v >= b.pages) updateBook(b.id, {read: b.pages, status:'done', finishedAt: dayKey(daysAgo(0)), lastReadAt: dayKey(daysAgo(0))}, '📚 LIVRO TERMINADO! +{xp} XP');
      else updateBook(b.id, {read: v, lastReadAt: dayKey(daysAgo(0))}, v > b.read ? '📖 +{xp} XP de leitura!' : '');
    }
    else if(a === 'finishBook'){
      const b = books.find(x => x.id === el.dataset.id);
      updateBook(b.id, {read: b.pages, status:'done', finishedAt: dayKey(daysAgo(0)), lastReadAt: dayKey(daysAgo(0))}, '📚 LIVRO TERMINADO! +{xp} XP');
    }
    else if(a === 'removeBook') removeBook(el.dataset.id);
    else if(a === 'openLesson'){ openLesson = openLesson === el.dataset.id ? null : el.dataset.id; renderMente(); }
    else if(a === 'answer') answerLesson(el.dataset.l, Number(el.dataset.i));
    else if(a === 'diarySave') saveDiary();
    else if(a === 'diaryDelete') deleteDiary(el.dataset.id);
    else if(a === 'diaryReplay'){ replayId = el.dataset.id; renderDiaryList(); setTimeout(() => { if(replayId === el.dataset.id) replayId = null; }, 4000); }
    else if(a === 'prevWeek'){ viewWeek = Math.max(0, viewWeek - 1); renderMissions(); }
    else if(a === 'nextWeek'){ viewWeek = Math.min(MAX_WEEK, viewWeek + 1); renderMissions(); }
    else if(a === 'trSubject'){ trSubject = el.dataset.k; renderTreino(); }
    else if(a === 'trMinutes'){ trMinutes = Number(el.dataset.m); renderTreino(); }
    else if(a === 'addTreino') addTreino();
  });

  /* =====================================================================
     LOGIN e sincronização com o Firestore
     ===================================================================== */
  function authMsg(err){
    const map = {
      'auth/invalid-credential': 'E-mail ou senha errados. Confira e tente de novo.',
      'auth/wrong-password': 'Senha errada.',
      'auth/user-not-found': 'Não encontrei esse e-mail.',
      'auth/invalid-email': 'Esse e-mail não parece certo.',
      'auth/too-many-requests': 'Muitas tentativas. Espere um pouco e tente de novo.',
      'auth/network-request-failed': 'Sem internet no momento.'
    };
    return map[err.code] || 'Não consegui entrar. Peça ajuda para um adulto.';
  }

  $('showPass').addEventListener('click', () => {
    const p = $('pass'), show = p.type === 'password';
    p.type = show ? 'text' : 'password';
    $('showPass').textContent = show ? 'Esconder senha' : 'Mostrar senha';
  });

  $('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    $('authErr').hidden = true;
    $('loginBtn').disabled = true;
    try{ await signInWithEmailAndPassword(auth, $('email').value.trim(), $('pass').value); }
    catch(err){ $('authErr').textContent = authMsg(err); $('authErr').hidden = false; }
    finally{ $('loginBtn').disabled = false; }
  });

  $('logout').addEventListener('click', () => signOut(auth));

  document.addEventListener('input', (e) => { if(e.target.id === 'diaryText') updateStage(); });

  document.addEventListener('submit', (e) => {
    if(e.target.id !== 'bookForm') return;
    e.preventDefault();
    const title = $('bTitle').value.trim(), author = $('bAuthor').value.trim();
    const pages = parseInt($('bPages').value, 10);
    if(title && pages > 0) addBook(title, author, pages);
  });

  $('nameForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const nome = $('nameInput').value.trim().slice(0, 20);
    if(!nome || !uid) return;
    profile = {nome};
    $('nameBox').hidden = true;
    renderHeader();
    try{ await setDoc(doc(db, 'users', uid, 'settings', 'perfil'), {nome}); }
    catch(err){ toast('Não consegui salvar o nome agora.', true); }
  });

  function stopSync(){ unsubs.forEach(u => u()); unsubs = []; }

  function startSync(){
    const fail = () => toast('Não consegui carregar seus dados.', true);
    unsubs.push(onSnapshot(collection(db, 'users', uid, 'missoes'), (snap) => {
      missions = {}; snap.forEach(d => { missions[d.id] = d.data(); });
      loaded.m = true; renderAll();
    }, fail));
    unsubs.push(onSnapshot(collection(db, 'users', uid, 'treinos'), (snap) => {
      treinos = []; snap.forEach(d => treinos.push({id: d.id, ...d.data()}));
      loaded.t = true; renderAll();
    }, fail));
    unsubs.push(onSnapshot(collection(db, 'users', uid, 'livros'), (snap) => {
      books = []; snap.forEach(d => books.push({id: d.id, ...d.data()}));
      loaded.b = true; renderAll();
    }, fail));
    unsubs.push(onSnapshot(collection(db, 'users', uid, 'mente'), (snap) => {
      mind = {}; snap.forEach(d => { mind[d.id] = d.data(); });
      loaded.n = true; renderAll();
    }, fail));
    unsubs.push(onSnapshot(collection(db, 'users', uid, 'diario'), (snap) => {
      diary = []; snap.forEach(d => diary.push({id: d.id, ...d.data()}));
      loaded.d = true; renderDiaryList();
    }, fail));
    unsubs.push(onSnapshot(doc(db, 'users', uid, 'settings', 'perfil'), (snap) => {
      profile = snap.exists() ? snap.data() : null;
      loaded.p = true; renderHeader();
      $('nameBox').hidden = !!(profile && profile.nome);   // pede o nome só se ainda não existir
    }, fail));
  }

  onAuthStateChanged(auth, (user) => {
    if(user){
      uid = user.uid;
      $('auth').style.display = 'none';
      $('app').style.display = 'block';
      viewWeek = Math.min(Math.max(currentWeekIdx(), 0), MAX_WEEK);    // abre na semana de hoje
      renderAll();
      startSync();
    }else{
      stopSync();
      uid = null; missions = {}; treinos = []; profile = null;
      loaded = {m:false, t:false, p:false, b:false, n:false, d:false}; lastLevelIdx = null; books = []; showAddBook = false;
      mind = {}; diary = []; openLesson = null; quizWrong = {}; diaryPrev = 0; $('tab-diario').innerHTML = '';
      $('app').style.display = 'none';
      $('auth').style.display = 'grid';
      $('pass').value = '';
      $('nameBox').hidden = true;
    }
  });
</script>

  // Service worker: necessário para o navegador oferecer "Instalar app"
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>
